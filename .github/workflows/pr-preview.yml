name: pr-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - uses: pnpm/action-setup@v3
      - run: pnpm install --frozen-lockfile

      - name: Build with preview base path
        run: pnpm build
        env:
          VITE_BASE: /speckit-navigator/previews/pr-${{ github.event.pull_request.number }}/
          VITE_DEFAULT_OWNER: DeepBlueCLtd
          VITE_DEFAULT_REPO: speckit-navigator

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          branch: gh-pages
          commit-message: "preview: PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
          single-commit: false

      - name: Upsert preview comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const branch = context.payload.pull_request.head.ref;
            const base = `https://deepbluecltd.github.io/speckit-navigator/previews/pr-${prNum}/`;
            const marker = '<!-- speckit-navigator-preview -->';
            const body = [
              marker,
              `### Preview deployment`,
              ``,
              `**Default view (this repo's bundled spec):** ${base}`,
              ``,
              `**Deep link to this branch:** ${base}?repo=DeepBlueCLtd/speckit-navigator&branch=${encodeURIComponent(branch)}`,
              ``,
              `**Other URL shapes you can try:**`,
              `- Spec 237 on the head branch: ${base}?repo=DeepBlueCLtd/speckit-navigator&branch=${encodeURIComponent(branch)}`,
              `- An upstream debrief-future PR: ${base}?repo=debrief/debrief-future&pr=456`,
              `- Any GitHub repo: ${base}?repo=octocat/hello-world&branch=master`,
              ``,
              `Last deploy: \`${sha.substring(0, 7)}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }
